# Blocks pushes that contain NVIDIA HairWorks SDK material (GameWorks EULA section 8). See tools/sdk_guard.py.
name: sdk-guard
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sdk_guard.py --tracked
